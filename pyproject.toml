[project]
name = "ethical-guardian"
version = "0.1.0"
description = "Lifecycle-adaptive ethical and economic evaluation of autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fairlearn>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # bugbear (common bug patterns)
    "UP",  # modern Python syntax
    "NPY", # NumPy-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
